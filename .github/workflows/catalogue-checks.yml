name: Spare Parts Catalogue Checks
on:
  push:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'parts-data.js'
      - 'app.js'
      - 'tests/**'
      - '.github/workflows/catalogue-checks.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'parts-data.js'
      - 'app.js'
      - 'tests/**'
      - '.github/workflows/catalogue-checks.yml'
jobs:
  catalogue:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check parts-data.js
          node --check catalogue-utils.js
      - name: Test catalogue data and page structure
        run: node --test tests/*.test.cjs
